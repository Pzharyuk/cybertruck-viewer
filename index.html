<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #8d929c; overflow: hidden; touch-action: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 38%, #e7e8ee 0%, #c5c8d0 42%, #8e939c 100%);
  }
  #c { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c.pointing { cursor: pointer; }
  #err {
    display: none; position: absolute; left: 16px; right: 16px; top: 16px;
    padding: 12px 14px; background: #3a1212; color: #ffd7d7; border-radius: 10px;
    font-size: 14px; z-index: 5;
  }
  #top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(10px + env(safe-area-inset-top)) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 2;
  }
  #top b { letter-spacing: 0.18em; font-size: 13px; color: #1c1e22; font-weight: 650; }
  #status { color: #2a2d33; font-size: 13px; background: rgba(255,255,255,0.55);
    border-radius: 999px; padding: 4px 10px; }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(16,17,20,0.78), rgba(16,17,20,0.0));
  }
  button.act, button.swatch {
    pointer-events: auto; border: 0; cursor: pointer;
    min-height: 44px; min-width: 44px;
  }
  button.act {
    background: rgba(255,255,255,0.92); color: #16181c; border-radius: 12px;
    padding: 0 14px; font-size: 15px; font-weight: 600;
  }
  button.act:active { transform: scale(0.98); }
  #swatches { display: flex; gap: 8px; margin-left: auto; }
  button.swatch {
    width: 44px; height: 44px; border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7), 0 2px 6px rgba(0,0,0,0.25);
  }
  button.swatch.on { box-shadow: inset 0 0 0 3px #fff, 0 0 0 2px #111; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<div id="top"><b>CYBERTRUCK</b><div id="status">Loading</div></div>
<div id="bar">
  <button class="act" id="openAll" type="button">Open all</button>
  <button class="act" id="closeAll" type="button">Close all</button>
  <button class="act" id="reset" type="button">Reset view</button>
  <div id="swatches"></div>
</div>

  }
}
</script>

// Blender Z-up, +Y nose (x, y, z) → three.js (x, z, -y). Nose is -Z, up is +Y.
function swizzle(v) { return new THREE.Vector3(v[0], v[2], -v[1]); }

function homeDirection() {
  const fwd = swizzle([0, 1, 0]);
  const up = swizzle([0, 0, 1]);
  const right = new THREE.Vector3().crossVectors(up, fwd).normalize();
  return fwd.addScaledVector(right, 0.72);
}

function fitDistance(radius, aspect) {
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const fov = Math.min(vFov, hFov);
  return (radius / Math.sin(fov / 2)) * 1.15;
}

function frameFromBox(box, dir) {
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const target = new THREE.Vector3(center.x, box.min.y + size.y * 0.42, center.z);
  const radius = 0.5 * Math.hypot(size.x, size.y, size.z);
  const dist = Math.max(fitDistance(Math.max(radius, 0.05), camera.aspect), controls.minDistance);
  const minDy = dist * Math.cos(controls.maxPolarAngle);
  const maxDy = dist * Math.cos(controls.minPolarAngle);
  const dy = THREE.MathUtils.clamp(1.75 - target.y, minDy, maxDy);
  const horiz = new THREE.Vector3(dir.x, 0, dir.z);
  if (horiz.lengthSq() < 1e-8) horiz.set(0, 0, 1);
  horiz.normalize();
  const horizLen = Math.sqrt(Math.max(dist * dist - dy * dy, 0));
  const position = target.clone().addScaledVector(horiz, horizLen);
  position.y = target.y + dy;
  if (dist > controls.maxDistance) controls.maxDistance = dist * 1.15;
  return { target, position, dist };
}
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

const WRAPS = [
  { id: 'stainless', name: 'Stainless', color: '#bfbfc4', metalness: 1.0, roughness: 0.30 },
  { id: 'stealth', name: 'Satin Stealth Black', color: '#1a1b1e', metalness: 0.42, roughness: 0.45 },
  { id: 'white', name: 'Satin Ceramic White', color: '#e7e4de', metalness: 0.35, roughness: 0.45 },
  { id: 'rose', name: 'Satin Rose Gold', color: '#b76e79', metalness: 0.48, roughness: 0.43 },
  { id: 'forest', name: 'Forest Green', color: '#1b3a2a', metalness: 0.40, roughness: 0.45 },
];

const parts = [];
const byName = {};
let modelBox = null;
let homePos = new THREE.Vector3();
let homeTgt = new THREE.Vector3();
const glide = { active: false, home: false, u: 1, fromP: new THREE.Vector3(), toP: new THREE.Vector3(), fromT: new THREE.Vector3(), toT: new THREE.Vector3() };

function glideTo(target, position, home) {
  glide.fromP.copy(camera.position);
  glide.fromT.copy(controls.target);
  glide.toT.copy(target);
  glide.toP.copy(position);
  glide.u = 0;
  glide.active = true;
  glide.home = home;
}

function readMotion(ud) {
  if (!ud) return null;
  if (typeof ud.ct_json === 'string') {
    try { return JSON.parse(ud.ct_json); } catch (e) { /* fall through */ }
  }
  if (ud.ct_motion) {
    return {
      motion: ud.ct_motion,
      axis: [+ud.ct_axis_x || 0, +ud.ct_axis_y || 0, +ud.ct_axis_z || 0],
      open_deg: +ud.ct_open_deg || 0,
      offset: [+ud.ct_off_x || 0, +ud.ct_off_y || 0, +ud.ct_off_z || 0],
    };
  }
  return null;
}

function paintWrap(wrap) {
  const c = new THREE.Color(wrap.color);
  scene.traverse((o) => {
    const mats = !o.material ? [] : (Array.isArray(o.material) ? o.material : [o.material]);
    for (const m of mats) {
      if (m && m.name === 'Body_Paint') {
        m.color.copy(c);
        m.metalness = wrap.metalness;
        m.roughness = wrap.roughness;
        m.needsUpdate = true;
      }
    }
  });
  document.querySelectorAll('button.swatch').forEach((b) => b.classList.toggle('on', b.dataset.id === wrap.id));
  statusEl.textContent = wrap.name;
}

function framePart(node) {
  const name = node.name || '';
  let dir = homeDirection();
  if (name.endsWith('L')) dir = new THREE.Vector3(-1, 0, 0.15);
  if (name.endsWith('R')) dir = new THREE.Vector3(1, 0, 0.15);
  if (name === 'Frunk') dir = new THREE.Vector3(0.35, 0, -1);
  if (name === 'Tailgate') dir = new THREE.Vector3(0.2, 0, 1);
  if (name === 'Tonneau') dir = new THREE.Vector3(0.55, 0, 0.7);
  const box = modelBox ? modelBox.clone() : new THREE.Box3().setFromObject(node);
  box.union(new THREE.Box3().setFromObject(node));
  userMoved = true;
  const frame = frameFromBox(box, dir);
  glideTo(frame.target, frame.position, false);
}

function toggle(name) {
  const p = byName[name];
  if (!p || (p.motion !== 'rotate' && p.motion !== 'translate')) return;
  p.target = p.target > 0.5 ? 0 : 1;
  framePart(p.node);
  statusEl.textContent = name.replace('_', ' ') + (p.target ? ' open' : ' closed');
}

function setAll(v) {
  for (const p of parts) {
    if (p.motion === 'rotate' || p.motion === 'translate') p.target = v;
  }
  statusEl.textContent = v ? 'Open' : 'Closed';
}

function goHome() {
  if (!modelBox) return;
  userMoved = false;
  const frame = frameFromBox(modelBox, homeDirection());
  homeTgt.copy(frame.target);
  homePos.copy(frame.position);
  glideTo(homeTgt, homePos, true);
}

document.getElementById('openAll').onclick = () => setAll(1);
document.getElementById('closeAll').onclick = () => setAll(0);
document.getElementById('reset').onclick = () => goHome();
const swatchBox = document.getElementById('swatches');
for (const w of WRAPS) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'swatch';
  b.dataset.id = w.id;
  b.title = w.name;
  b.setAttribute('aria-label', w.name);
  b.style.background = w.color;
  b.onclick = () => paintWrap(w);
  swatchBox.appendChild(b);
}

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
loader.setDRACOLoader(draco);
const raw = Uint8Array.from(atob(GLB_B64), (ch) => ch.charCodeAt(0));
loader.parse(raw.buffer, '', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  model.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
    const info = readMotion(o.userData);
    if (!info || !info.motion) return;
    const axis = swizzle(info.axis).normalize();
    const offset = swizzle(info.offset);
    const part = {
      name: o.name,
      node: o,
      motion: info.motion,
      axis,
      angle: (info.open_deg || 0) * Math.PI / 180,
      offset,
      closedPos: o.position.clone(),
      closedQuat: o.quaternion.clone(),
      t: 0,
      target: 0,
    };
    parts.push(part);
    byName[o.name] = part;
  });
  modelBox = new THREE.Box3().setFromObject(model);
  const frame = frameFromBox(modelBox, homeDirection());
  homeTgt.copy(frame.target);
  homePos.copy(frame.position);
  camera.position.copy(homePos);
  controls.target.copy(homeTgt);
  controls.update();
  paintWrap(WRAPS[0]);
  statusEl.textContent = 'Stainless';
  console.log('cybertruck nodes', parts.map((p) => p.name).join(', '));
}, fail);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const TAP_MOVE_PX = 10;

function hitPart(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return null;
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  for (const h of hits) {
    if (h.object === ground) continue;
    let o = h.object;
    while (o) {
      const p = byName[o.name];
      if (p && (p.motion === 'rotate' || p.motion === 'translate')) return p;
      o = o.parent;
    }
  }
  return null;
}

function setHoverCursor(clientX, clientY) {
  canvas.classList.toggle('pointing', !!hitPart(clientX, clientY));
}

let downId = null, downX = 0, downY = 0, dragged = false;
canvas.addEventListener('pointerdown', (e) => {
  downId = e.pointerId;
  downX = e.clientX;
  downY = e.clientY;
  dragged = false;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
});
canvas.addEventListener('pointermove', (e) => {
  if (downId === e.pointerId) {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > TAP_MOVE_PX) dragged = true;
    return;
  }
  if (e.pointerType === 'mouse' && downId === null) setHoverCursor(e.clientX, e.clientY);
});
function endPointer(e) {
  if (downId !== e.pointerId) return;
  const wasDrag = dragged || Math.hypot(e.clientX - downX, e.clientY - downY) > TAP_MOVE_PX;
  downId = null;
  dragged = false;
  try { if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (e.type !== 'pointerup' || wasDrag) {
    if (e.pointerType === 'mouse') canvas.classList.remove('pointing');
    return;
  }
  const p = hitPart(e.clientX, e.clientY);
  if (p) toggle(p.name);
  if (e.pointerType === 'mouse') setHoverCursor(e.clientX, e.clientY);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const speed = 1 / 0.7;
  for (const p of parts) {
    if (p.t < p.target) p.t = Math.min(p.target, p.t + speed * dt);
    else if (p.t > p.target) p.t = Math.max(p.target, p.t - speed * dt);
    const e = easeInOutCubic(p.t);
    if (p.motion === 'rotate') {
      p.node.quaternion.copy(p.closedQuat);
      p.node.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(p.axis, p.angle * e));
    } else if (p.motion === 'translate') {
      p.node.position.copy(p.closedPos).addScaledVector(p.offset, e);
    }
  }
  if (glide.active) {
    glide.u = Math.min(1, glide.u + dt / 1.0);
    const k = easeInOutCubic(glide.u);
    camera.position.lerpVectors(glide.fromP, glide.toP, k);
    controls.target.lerpVectors(glide.fromT, glide.toT, k);
    if (glide.u >= 1) glide.active = false;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (userMoved || !modelBox) return;
  const frame = frameFromBox(modelBox, homeDirection());
  homeTgt.copy(frame.target);
  homePos.copy(frame.position);
  if (glide.active && glide.home) {
    glide.toP.copy(homePos);
    glide.toT.copy(homeTgt);
  } else if (!glide.active) {
    camera.position.copy(homePos);
    controls.target.copy(homeTgt);
  }
});
document.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });

window.__ct = {
  toggle, setAll, paintWrap, wraps: WRAPS,
  parts: () => parts.map((p) => ({ name: p.name, t: p.t, target: p.target, motion: p.motion })),
  hit: (x, y) => hitPart(x, y)?.name || null,
  screenOf: (name) => {
    const p = byName[name];
    if (!p) return null;
    const w = window.innerWidth, h = window.innerHeight;
    const pad = 16;
    const bottom = 160; // keep clear of the control bar
    for (let y = pad; y < h - bottom; y += 6) {
      for (let x = pad; x < w - pad; x += 6) {
        if (hitPart(x, y) === p) return { x, y, visible: true };
      }
    }
    const c = new THREE.Box3().setFromObject(p.node).getCenter(new THREE.Vector3());
    c.project(camera);
    return {
      x: (c.x * 0.5 + 0.5) * w,
      y: (-c.y * 0.5 + 0.5) * h,
      visible: false,
    };
  },
};
</script>
</body>
</html>
